<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYOTUBE ADMIN</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:linear-gradient(135deg,#08070c,#151020,#0b1018);
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh
}

header{
padding:22px 16px;
text-align:center;
background:rgba(20,18,30,.92);
border-bottom:1px solid #302a40
}

h1{
margin:0;
font-size:25px;
letter-spacing:1px
}

h2{
font-size:18px;
margin:0 0 15px
}

main{
width:100%;
max-width:900px;
margin:auto;
padding:18px
}

.card{
background:rgba(22,20,31,.96);
border:1px solid #332d43;
border-radius:18px;
padding:18px;
margin-bottom:18px;
box-shadow:0 10px 35px rgba(0,0,0,.28)
}

.status{
padding:12px;
border-radius:10px;
background:#0d291d;
color:#7dffad;
text-align:center
}

.error{
background:#35151b!important;
color:#ff9ca8!important
}

/* TYPE SELECTOR */

.type-card{
max-width:620px;
margin:5px auto 20px;
text-align:center;
padding:24px;
background:linear-gradient(145deg,#211638,#111a2c);
border:1px solid #6040a0;
box-shadow:0 12px 40px rgba(80,40,160,.25)
}

.type-title{
font-size:14px;
color:#bda9ff;
margin-bottom:8px;
text-transform:uppercase;
letter-spacing:1.5px
}

.type-subtitle{
font-size:13px;
color:#999;
margin-bottom:15px
}

.type-select{
appearance:none;
-webkit-appearance:none;
width:100%;
padding:16px 45px 16px 16px;
border-radius:13px;
border:1px solid #7651c9;
background:linear-gradient(135deg,#30204e,#171a2c);
color:#fff;
font-size:16px;
font-weight:bold;
outline:none;
text-align:center;
cursor:pointer
}

.type-select:focus{
border-color:#9c75ff;
box-shadow:0 0 0 3px rgba(130,80,255,.15)
}

/* FORM */

.field{
display:none;
margin-top:14px
}

.field.show{
display:block
}

label{
display:block;
font-size:13px;
color:#bdb7c9;
margin-bottom:6px
}

input,
textarea{
width:100%;
padding:13px;
background:#0c0b11;
color:#fff;
border:1px solid #393342;
border-radius:10px;
outline:none
}

input:focus,
textarea:focus{
border-color:#7954d7;
box-shadow:0 0 0 2px rgba(121,84,215,.12)
}

textarea{
min-height:105px;
resize:vertical
}

.media-box{
padding:14px;
border:1px dashed #51486a;
border-radius:12px;
background:#100e17;
margin-top:14px
}

.media-title{
font-size:13px;
color:#c8bce4;
margin-bottom:8px
}

.preview{
margin-top:12px;
padding:10px;
border-radius:10px;
background:#09080d;
border:1px solid #302b3b
}

.preview img,
.preview video{
display:block;
max-width:100%;
max-height:280px;
margin:auto;
border-radius:8px
}

.preview audio{
width:100%
}

.hidden{
display:none!important
}

.row{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:16px
}

button{
border:0;
border-radius:10px;
padding:11px 15px;
background:#302b3c;
color:#fff;
cursor:pointer
}

button.primary{
background:linear-gradient(135deg,#7447ed,#a54cff)
}

button.ok{
background:#177b49
}

button.danger{
background:#b82d42
}

button:hover{
filter:brightness(1.15)
}

.small{
font-size:13px;
color:#aaa;
word-break:break-word
}

.item{
border:1px solid #332e3d;
border-radius:13px;
padding:14px;
margin:11px 0;
background:#100f15;
transition:.18s
}

.item.dragging{
opacity:.45;
transform:scale(.99)
}

.item.drop-target{
border-color:#8b5cf6;
box-shadow:0 0 0 2px rgba(139,92,246,.18)
}

.item img,
.item video{
display:block;
max-width:100%;
max-height:260px;
border-radius:9px;
margin-top:10px
}

.item audio{
width:100%;
margin-top:10px
}

/* ORDER */

.order-bar{
display:flex;
align-items:center;
gap:8px;
margin-bottom:10px;
padding-bottom:10px;
border-bottom:1px solid #292533
}

.drag-handle{
flex:1;
padding:10px 12px;
border-radius:9px;
background:#191622;
border:1px dashed #554b6b;
color:#cbbdf0;
font-size:13px;
text-align:center;
cursor:grab;
touch-action:none;
user-select:none
}

.drag-handle:active{
cursor:grabbing
}

.order-buttons{
display:flex;
gap:5px
}

.order-buttons button{
padding:8px 11px;
font-size:16px
}

.order-save{
margin-top:15px;
padding:12px;
border-radius:10px;
background:#171322;
border:1px solid #39304d
}

#orderStatus{
margin-top:8px
}

#uploadProgress{
height:7px;
background:#292532;
border-radius:10px;
overflow:hidden;
margin-top:10px;
display:none
}

#uploadBar{
height:100%;
width:0;
background:linear-gradient(90deg,#7042ef,#b44cff)
}

@media(max-width:600px){

main{padding:12px}

.card{padding:15px}

.type-card{padding:20px 15px}

.order-bar{
align-items:stretch
}

.drag-handle{
min-height:42px;
display:flex;
align-items:center;
justify-content:center
}

.order-buttons button{
min-width:42px
}

}
</style>
</head>

<body>

<header>
<h1>MAYOTUBE ADMIN</h1>
<div class="small">Owner Control Panel</div>
</header>

<main>

<div class="card">
<h2>System Status</h2>
<div id="systemStatus">Checking...</div>
</div>

<div class="card type-card">

<div class="type-title">
Homepage Content
</div>

<div class="type-subtitle">
Select what you want to add to MAYOTUBE
</div>

<select
id="type"
class="type-select"
onchange="typeChanged()">

<option value="message">💬 Message</option>
<option value="url">🔗 URL</option>
<option value="youtube">▶️ YouTube</option>
<option value="donation">💰 Donation</option>
<option value="notification">🔔 Notification</option>
<option value="image">🖼️ Image</option>
<option value="video">🎬 Video</option>
<option value="gif">🎞️ GIF</option>
<option value="audio">🎵 Audio</option>
<option value="music">🎧 Music</option>
<option value="gallery">🎥 Gallery Video</option>
<option value="live">🔴 Live Channel</option>
<option value="ad">📢 Advertisement</option>

</select>

</div>

<div class="card">

<div id="fieldMessage" class="field show">

<label>Message</label>

<textarea
id="message"
placeholder="اپنا پیغام یہاں لکھیں..."></textarea>

</div>

<div id="fieldUrl" class="field">

<label>Website URL</label>

<input
id="buttonUrl"
placeholder="https://example.com">

<label style="margin-top:12px">
Button Text
</label>

<input
id="buttonText"
placeholder="Open Website">

</div>

<div id="fieldYoutube" class="field">

<label>YouTube Video URL</label>

<input
id="mediaUrlYoutube"
placeholder="https://youtube.com/watch?v=...">

<label style="margin-top:12px">
Video Title
</label>

<input
id="messageYoutube"
placeholder="YouTube video title">

</div>

<div id="fieldDonation" class="field">

<label>Donation URL</label>

<input
id="buttonUrlDonation"
placeholder="https://...">

<label style="margin-top:12px">
Donation Message
</label>

<textarea
id="messageDonation"
placeholder="Support MAYOTUBE..."></textarea>

<label>Button Text</label>

<input
id="buttonTextDonation"
placeholder="Donate Now">

</div>

<div id="fieldNotification" class="field">

<label>Notification Message</label>

<textarea
id="messageNotification"
placeholder="Notification text..."></textarea>

</div>

<div id="fieldMedia" class="field">

<div class="media-box">

<div class="media-title">
Media URL
</div>

<input
id="mediaUrl"
placeholder="https://...">

<div class="media-title"
style="margin-top:14px">
OR Upload Media
</div>

<input
id="file"
type="file"
accept="image/*,video/*,audio/*">

<div id="preview"
class="preview hidden">
</div>

<div id="uploadProgress">
<div id="uploadBar"></div>
</div>

</div>

</div>

<div id="fieldButton" class="field">

<label>Button Text</label>

<input
id="commonButtonText"
placeholder="Watch Now">

<label style="margin-top:12px">
Button URL
</label>

<input
id="commonButtonUrl"
placeholder="https://...">

</div>

<div class="row">

<button
class="primary"
onclick="saveContent()">
Save Content
</button>

<button onclick="clearForm()">
Clear
</button>

<button onclick="loadContent()">
Refresh
</button>

</div>

<div
id="saveStatus"
class="small"
style="margin-top:10px">
</div>

</div>

<div class="card">

<h2>Saved Homepage Content</h2>

<div class="small" style="margin-bottom:12px">
پریس کرکے Box کو Drag کر کے اوپر یا نیچے کریں۔
موبائل پر ▲ ▼ بٹن بھی استعمال کر سکتے ہیں۔
</div>

<div id="contentList">
Loading...
</div>

<div class="order-save">

<button
class="primary"
style="width:100%"
onclick="saveOrder()">
💾 Save Homepage Order
</button>

<div
id="orderStatus"
class="small">
</div>

</div>

</div>

</main>

<script>

let editId=null;
let apiToken="";
let draggedItem=null;

const fields=[
"fieldMessage",
"fieldUrl",
"fieldYoutube",
"fieldDonation",
"fieldNotification",
"fieldMedia",
"fieldButton"
];

function hideAll(){

fields.forEach(id=>{
document.getElementById(id)
.classList.remove("show");
});

}

function show(id){

document.getElementById(id)
.classList.add("show");

}

function typeChanged(){

const type=
document.getElementById("type").value;

hideAll();

if(type==="message")
show("fieldMessage");

else if(type==="url")
show("fieldUrl");

else if(type==="youtube")
show("fieldYoutube");

else if(type==="donation")
show("fieldDonation");

else if(type==="notification")
show("fieldNotification");

else if(
type==="image"||
type==="video"||
type==="gif"||
type==="audio"||
type==="music"||
type==="gallery"||
type==="live"
)
show("fieldMedia");

else if(type==="ad"){

show("fieldMessage");
show("fieldMedia");
show("fieldButton");

}

}


/* SESSION */

async function getSession(){

const r=await fetch(
"/api/admin/session",
{
credentials:"same-origin",
cache:"no-store"
}
);

if(!r.ok)
throw new Error(
"Admin session not authenticated"
);

const d=await r.json();

if(!d.authenticated)
throw new Error(
"Admin session expired"
);

apiToken=d.api_token||"";

return d;
}


/* API */

async function api(url,options={}){

options.credentials="same-origin";
options.cache="no-store";

options.headers=
options.headers||{};

options.headers[
"X-MAYOTUBE-ADMIN"
]=apiToken;

if(
options.body &&
!(options.body instanceof FormData)
){

options.headers[
"Content-Type"
]="application/json";

}

const r=await fetch(url,options);

const text=await r.text();

let data={};

try{
data=JSON.parse(text);
}catch(e){}

if(!r.ok){

throw new Error(
data.error||
text||
("HTTP "+r.status)
);

}

return data;

}


/* STATUS */

async function checkStatus(){

const box=
document.getElementById(
"systemStatus"
);

try{

const r=await fetch(
"/api/health",
{
credentials:"same-origin",
cache:"no-store"
}
);

const d=await r.json();

if(r.ok&&d.status==="ok"){

box.className="status";

box.textContent=
"Online • Blob: "+
(
d.blob_configured
?"Configured"
:"Not Configured"
);

}else{

throw new Error(
"Health check failed"
);

}

}catch(e){

box.className=
"status error";

box.textContent=
"System Error: "+e.message;

}

}


/* LOAD */

async function loadContent(){

const box=
document.getElementById(
"contentList"
);

box.textContent="Loading...";

try{

await getSession();

const d=
await api(
"/api/admin/content"
);

const items=
Array.isArray(d.items)
?d.items:[];

if(!items.length){

box.innerHTML=
'<div class="small">'+
'No homepage content saved.'+
'</div>';

return;

}

box.innerHTML=
items.map(renderItem).join("");

enableDragDrop();

}catch(e){

box.innerHTML=
'<div class="error" '+
'style="padding:10px;border-radius:8px">'+
esc(e.message)+
'</div>';

}

}


/* RENDER */

function renderItem(item,index){

const id=
Number(item.id)||0;

const enabled=
item.enabled!==false;

const type=
item.type||"message";

const media=
item.media_url||"";

let preview="";

if(media){

if(type==="image"||
type==="gif"){

preview=
'<img src="'+
esc(media)+
'" loading="lazy">';

}

else if(
type==="video"||
type==="gallery"||
type==="live"
){

preview=
'<video src="'+
esc(media)+
'" controls preload="metadata"></video>';

}

else if(
type==="audio"||
type==="music"
){

preview=
'<audio src="'+
esc(media)+
'" controls></audio>';

}

}

return `

<div
class="item"
data-id="${id}">

<div class="order-bar">

<div
class="drag-handle"
title="Press and drag">
☰ &nbsp; Press & Drag to Move
</div>

<div class="order-buttons">

<button
title="Move Up"
onclick="moveItem(${id},-1)">
▲
</button>

<button
title="Move Down"
onclick="moveItem(${id},1)">
▼
</button>

</div>

</div>

<b>
#${id} • ${esc(type)}
</b>

<div class="small">
Order Position: ${index+1}
</div>

<div class="small">
Status:
${enabled?"Enabled":"Disabled"}
</div>

${
item.message
?
'<div style="margin-top:8px">'+
esc(item.message)+
'</div>'
:""
}

${
item.button_text
?
'<div class="small">'+
'Button: '+
esc(item.button_text)+
'</div>'
:""
}

${
item.button_url
?
'<div class="small">'+
'URL: '+
esc(item.button_url)+
'</div>'
:""
}

${
media
?
'<div class="small">'+
'Media: '+
esc(media)+
'</div>'
:""
}

${preview}

<div class="row">

<button
onclick="editItem(${id})">
Edit
</button>

<button
class="${enabled?'':'ok'}"
onclick="toggleItem(${id})">
${enabled?"Disable":"Enable"}
</button>

<button
class="danger"
onclick="deleteItem(${id})">
Delete
</button>

</div>

</div>

`;

}


/* DRAG */

function enableDragDrop(){

const items=
document.querySelectorAll(
"#contentList .item"
);

items.forEach(item=>{

const handle=
item.querySelector(".drag-handle");

if(!handle)return;

handle.onpointerdown=
function(){

item.setPointerCapture?.(
event.pointerId
);

};

item.draggable=true;

item.ondragstart=
function(){

draggedItem=item;

item.classList.add(
"dragging"
);

};

item.ondragend=
function(){

item.classList.remove(
"dragging"
);

document.querySelectorAll(
".drop-target"
).forEach(x=>
x.classList.remove(
"drop-target"
)
);

draggedItem=null;

};

item.ondragover=
function(e){

e.preventDefault();

if(
draggedItem &&
draggedItem!==item
){

item.classList.add(
"drop-target"
);

}

};

item.ondragleave=
function(){

item.classList.remove(
"drop-target"
);

};

item.ondrop=
function(e){

e.preventDefault();

item.classList.remove(
"drop-target"
);

if(
!draggedItem ||
draggedItem===item
)return;

const parent=
item.parentNode;

const rect=
item.getBoundingClientRect();

if(
e.clientY<
rect.top+
rect.height/2
){

parent.insertBefore(
draggedItem,
item
);

}else{

parent.insertBefore(
draggedItem,
item.nextSibling
);

}

updatePositions();

};

});

}


/* POSITION */

function updatePositions(){

document.querySelectorAll(
"#contentList .item"
).forEach(
(item,index)=>{

const smalls=
item.querySelectorAll(
".small"
);

if(smalls.length>1){

smalls[0].textContent=
"Order Position: "+(index+1);

}

}
);

}


/* MOVE UP / DOWN */

function moveItem(id,direction){

const list=
document.getElementById(
"contentList"
);

const item=
list.querySelector(
'.item[data-id="'+id+'"]'
);

if(!item)return;

if(direction<0){

const previous=
item.previousElementSibling;

if(previous)
list.insertBefore(
item,
previous
);

}else{

const next=
item.nextElementSibling;

if(next)
list.insertBefore(
item,
next.nextSibling
);

}

updatePositions();

}


/* SAVE ORDER */

async function saveOrder(){

const status=
document.getElementById(
"orderStatus"
);

const items=
Array.from(
document.querySelectorAll(
"#contentList .item"
)
);

if(!items.length){

status.textContent=
"No content to reorder.";

return;

}

const order=
items.map(
item=>Number(
item.dataset.id
)
);

status.textContent=
"Saving homepage order...";

try{

await getSession();

await api(
"/api/admin/content/reorder",
{
method:"POST",
body:JSON.stringify({
order:order
})
}
);

status.textContent=
"✓ Homepage order saved successfully.";

await loadContent();

}catch(e){

status.textContent=
"Order save failed: "+
e.message;

}

}


/* SAVE */

async function saveContent(){

const status=
document.getElementById(
"saveStatus"
);

status.textContent="Saving...";

try{

await getSession();

const type=
document.getElementById(
"type"
).value;

let item={
type:type,
message:"",
button_text:"",
button_url:"",
media_url:"",
enabled:true
};

if(type==="message"){

item.message=
document.getElementById(
"message"
).value.trim();

}

else if(type==="url"){

item.button_url=
document.getElementById(
"buttonUrl"
).value.trim();

item.button_text=
document.getElementById(
"buttonText"
).value.trim();

}

else if(type==="youtube"){

item.media_url=
document.getElementById(
"mediaUrlYoutube"
).value.trim();

item.message=
document.getElementById(
"messageYoutube"
).value.trim();

}

else if(type==="donation"){

item.button_url=
document.getElementById(
"buttonUrlDonation"
).value.trim();

item.message=
document.getElementById(
"messageDonation"
).value.trim();

item.button_text=
document.getElementById(
"buttonTextDonation"
).value.trim();

}

else if(type==="notification"){

item.message=
document.getElementById(
"messageNotification"
).value.trim();

}

else if(
type==="image"||
type==="video"||
type==="gif"||
type==="audio"||
type==="music"||
type==="gallery"||
type==="live"
){

item.media_url=
document.getElementById(
"mediaUrl"
).value.trim();

const file=
document.getElementById(
"file"
).files[0];

if(file){

status.textContent=
"Uploading media...";

const fd=
new FormData();

fd.append("file",file);

showProgress(true,30);

const upload=
await api(
"/api/admin/media/upload",
{
method:"POST",
body:fd
}
);

showProgress(true,100);

item.media_url=
upload.url||
upload.media_url||
"";

if(!item.media_url)
throw new Error(
"Upload succeeded but no media URL returned"
);

}

}

else if(type==="ad"){

item.message=
document.getElementById(
"message"
).value.trim();

item.media_url=
document.getElementById(
"mediaUrl"
).value.trim();

item.button_text=
document.getElementById(
"commonButtonText"
).value.trim();

item.button_url=
document.getElementById(
"commonButtonUrl"
).value.trim();

const file=
document.getElementById(
"file"
).files[0];

if(file){

const fd=
new FormData();

fd.append("file",file);

status.textContent=
"Uploading advertisement...";

const upload=
await api(
"/api/admin/media/upload",
{
method:"POST",
body:fd
}
);

item.media_url=
upload.url||
upload.media_url||
"";

}

}

if(editId!==null){

item.id=editId;

await api(
"/api/admin/content/update",
{
method:"POST",
body:JSON.stringify(item)
}
);

status.textContent=
"Content updated successfully.";

}else{

await api(
"/api/admin/content/save",
{
method:"POST",
body:JSON.stringify(item)
}
);

status.textContent=
"Content saved successfully.";

}

editId=null;

clearForm();

await loadContent();

}catch(e){

status.textContent=
"Save failed: "+e.message;

}finally{

setTimeout(
()=>showProgress(false),
500
);

}

}


/* DELETE */

async function deleteItem(id){

if(!confirm(
"Delete this content?"
))return;

try{

await getSession();

await api(
"/api/admin/content/delete",
{
method:"POST",
body:JSON.stringify({
id:id
})
}
);

await loadContent();

}catch(e){

alert(
"Delete failed: "+
e.message
);

}

}


/* TOGGLE */

async function toggleItem(id){

try{

await getSession();

await api(
"/api/admin/content/toggle",
{
method:"POST",
body:JSON.stringify({
id:id
})
}
);

await loadContent();

}catch(e){

alert(
"Toggle failed: "+e.message
);

}

}


/* EDIT */

async function editItem(id){

try{

await getSession();

const d=
await api(

/* CLEAR */

function clearDynamicFields(){

const ids=[
"message",
"buttonText",
"buttonUrl",
"mediaUrl",
"mediaUrlYoutube",
"messageYoutube",
"buttonUrlDonation",
"messageDonation",
"buttonTextDonation",
"messageNotification",
"commonButtonText",
"commonButtonUrl"
];

ids.forEach(id=>{

const el=
document.getElementById(id);

if(el)el.value="";

});

document.getElementById(
"file"
).value="";

showPreview("","");

}

function clearForm(){

editId=null;

clearDynamicFields();

document.getElementById(
"saveStatus"
).textContent="";

document.getElementById(
"type"
).value="message";

typeChanged();

}


/* PREVIEW */

function showPreview(type,url){

const box=
document.getElementById(
"preview"
);

if(!url){

box.classList.add(
"hidden"
);

box.innerHTML="";

return;

}

let html="";

if(
type==="image"||
type==="gif"
){

html=
'<img src="'+
esc(url)+
'" onerror="previewError()">';

}

else if(
type==="video"||
type==="gallery"||
type==="live"
){

html=
'<video src="'+
esc(url)+
'" controls></video>';

}

else if(
type==="audio"||
type==="music"
){

html=
'<audio src="'+
esc(url)+
'" controls></audio>';

}

else if(type==="ad"){

html=
'<img src="'+
esc(url)+
'" onerror="previewError()">';

}

else{

box.classList.add(
"hidden"
);

return;

}

box.innerHTML=html;

box.classList.remove(
"hidden"
);

}

function previewError(){

document.getElementById(
"preview"
).innerHTML=
'<div class="small">'+
'Media preview could not be loaded.'+
'</div>';

}


/* PROGRESS */

function showProgress(show,value){

const box=
document.getElementById(
"uploadProgress"
);

const bar=
document.getElementById(
"uploadBar"
);

if(!show){

box.style.display="none";

bar.style.width="0%";

return;

}

box.style.display="block";

bar.style.width=
Math.max(
0,
Math.min(100,value||0)
)+"%";

}


/* FILE PREVIEW */

document.getElementById(
"file"
).addEventListener(
"change",
function(){

const file=this.files[0];

if(!file)return;

const type=
document.getElementById(
"type"
).value;

showPreview(
type,
URL.createObjectURL(file)
);

}
);


/* MEDIA URL PREVIEW */

document.getElementById(
"mediaUrl"
).addEventListener(
"input",
function(){

showPreview(
document.getElementById(
"type"
).value,
this.value.trim()
);

}
);


/* ESCAPE */

function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* INIT */

async function init(){

try{

await getSession();

await checkStatus();

}catch(e){

document.getElementById(

document.getElementById(
"contentList"
).innerHTML=
'<div class="error" '+
'style="padding:10px;border-radius:8px">'+
esc(e.message)+
'</div>';

}

}

init();

</script>
