<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYOTUBE ADMIN</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0c0b10;
 color:#fff;
 font-family:Arial,sans-serif
}
header{
 background:#171521;
 padding:18px;
 border-bottom:1px solid #292536;
 position:sticky;
 top:0;
 z-index:10
}
h1{margin:0;font-size:22px}
small{color:#9ca3af}
main{
 max-width:900px;
 margin:auto;
 padding:16px
}
.card{
 background:#15131e;
 border:1px solid #292536;
 border-radius:14px;
 padding:16px;
 margin-bottom:16px
}
h2{
 margin:0 0 14px;
 font-size:18px
}
label{
 display:block;
 color:#c4c7d0;
 font-size:13px;
 margin:12px 0 6px
}
input,select,textarea{
 width:100%;
 background:#0f0e15;
 color:#fff;
 border:1px solid #353043;
 border-radius:9px;
 padding:12px;
 outline:none
}
textarea{
 min-height:100px;
 resize:vertical
}
button{
 border:0;
 border-radius:9px;
 padding:12px 16px;
 background:#8b5cf6;
 color:#fff;
 font-weight:bold;
 cursor:pointer;
 margin-top:12px
}
button.secondary{background:#292536}
button.danger{background:#b42318}
button:disabled{
 opacity:.5;
 cursor:not-allowed
}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.status{
 padding:12px;
 border-radius:9px;
 background:#0f0e15;
 color:#c4c7d0;
 margin-top:12px;
 white-space:pre-wrap
}
.item{
 background:#0f0e15;
 border:1px solid #302b3c;
 border-radius:12px;
 padding:14px;
 margin-top:10px
}
.item-title{
 font-weight:bold;
 margin-bottom:7px
}
.item-meta{
 color:#9ca3af;
 font-size:12px;
 line-height:1.7
}
.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap
}
.actions button{
 margin-top:8px;
 padding:9px 12px;
 font-size:12px
}
.preview{
 width:100%;
 max-height:220px;
 object-fit:contain;
 border-radius:9px;
 margin-top:10px;
 background:#000
}
.hidden{display:none}
.ok{color:#4ade80}
.err{color:#f87171}
</style>
</head>

<body>

<header>
<h1>MAYOTUBE ADMIN</h1>
<small>Owner Admin • Homepage Content Manager</small>
</header>

<main>

<div class="card">
<h2>➕ Add Homepage Content</h2>

<label>Content Type</label>
<select id="type">
<option value="message">Message</option>
<option value="image">Image</option>
<option value="video">Video</option>
<option value="gif">GIF</option>
<option value="notification">Notification</option>
<option value="advertisement">Advertisement</option>
<option value="donation">Donation</option>
<option value="audio">Audio</option>
<option value="music">Music Link</option>
<option value="gallery_video">Gallery Video</option>
<option value="live_channel">Live Channel</option>
<option value="youtube">YouTube Video</option>
<option value="link">URL / Web Link</option>
</select>

<label>Title</label>
<input id="title" placeholder="Post title">

<label>Message / Description</label>
<textarea id="message" placeholder="اپنا پیغام یا description لکھیں"></textarea>

<label>Media / Content URL</label>
<input id="url" placeholder="https://...">

<label>Button Text</label>
<input id="buttonText" placeholder="مثلاً Watch Now">

<label>Button URL</label>
<input id="buttonUrl" placeholder="https://...">

<div class="row">
<div>
<label>Order</label>
<input id="sortOrder" type="number" value="0">
</div>

<div>
<label>Status</label>
<select id="enabled">
<option value="true">Enabled</option>
<option value="false">Disabled</option>
</select>
</div>
</div>

<button id="saveBtn" onclick="saveContent()">Save Content</button>

<div id="saveStatus" class="status hidden"></div>
</div>


<div class="card">
<h2>📤 Media Upload</h2>

<label>Select Image / Video / GIF / Audio</label>
<input id="mediaFile" type="file">

<button onclick="uploadMedia()">Upload Media</button>

<div id="uploadStatus" class="status hidden"></div>
</div>


<div class="card">
<h2>🏠 Saved Homepage Content</h2>

<button class="secondary" onclick="loadContent()">↻ Refresh</button>

<div id="contentList">
<div class="status">Loading...</div>
</div>
</div>


<div class="card">
<h2>⚙️ System Status</h2>

<div id="systemStatus" class="status">Checking...</div>
</div>

</main>

<script>
const API="";

function token(){
 return localStorage.getItem("MAYOTUBE_ADMIN_TOKEN")||"";
}

function headers(json=false){
 const h={
  "Authorization":"Bearer "+token()
 };
 if(json)h["Content-Type"]="application/json";
 return h;
}

function show(id,text,ok=false){
 const e=document.getElementById(id);
 e.classList.remove("hidden");
 e.innerHTML='<span class="'+(ok?"ok":"err")+'">'+escapeHtml(text)+'</span>';
}

function escapeHtml(v){
 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

async function saveContent(){
 const btn=document.getElementById("saveBtn");
 btn.disabled=true;

 const data={
  type:document.getElementById("type").value,
  title:document.getElementById("title").value.trim(),
  message:document.getElementById("message").value.trim(),
  url:document.getElementById("url").value.trim(),
  button_text:document.getElementById("buttonText").value.trim(),
  button_url:document.getElementById("buttonUrl").value.trim(),
  sort_order:Number(document.getElementById("sortOrder").value)||0,
  enabled:document.getElementById("enabled").value==="true"
 };

 try{
  const r=await fetch(API+"/api/admin/content",{
   method:"POST",
   headers:headers(true),
   body:JSON.stringify(data)
  });

  const t=await r.text();

  if(!r.ok){
   throw new Error(t||("HTTP "+r.status));
  }

  show("saveStatus","Content saved successfully",true);
  document.getElementById("message").value="";
  document.getElementById("url").value="";
  document.getElementById("title").value="";
  document.getElementById("buttonText").value="";
  document.getElementById("buttonUrl").value="";
  loadContent();

 }catch(e){
  show("saveStatus","Save failed: "+e.message);
 }finally{
  btn.disabled=false;
 }
}


async function loadContent(){
 const box=document.getElementById("contentList");
 box.innerHTML='<div class="status">Loading...</div>';

 try{
  const r=await fetch(API+"/api/home/content?refresh="+Date.now(),{
   headers:headers()
  });

  const data=await r.json();

  if(!r.ok){
   throw new Error(data.error||("HTTP "+r.status));
  }

  const items=Array.isArray(data.items)?data.items:[];

  if(!items.length){
   box.innerHTML='<div class="status">No homepage content found.</div>';
   return;
  }

  box.innerHTML="";

  items.forEach((item,index)=>{
   const div=document.createElement("div");
   div.className="item";

   const type=escapeHtml(item.type||"");
   const title=escapeHtml(item.title||"");
   const message=escapeHtml(item.message||"");
   const url=escapeHtml(item.url||item.media_url||"");
   const enabled=item.enabled!==false;

   div.innerHTML=
    '<div class="item-title">'+
    (title||("Content #"+(item.id||index+1)))+
    '</div>'+
    '<div class="item-meta">'+
    'Type: '+type+
    '<br>ID: '+escapeHtml(item.id||"")+
    '<br>Status: '+(enabled?"Enabled":"Disabled")+
    (message?'<br>'+message:"")+
    (url?'<br>URL: '+url:"")+
    '</div>'+
    '<div class="actions">'+
    '<button class="secondary" onclick="toggleContent('+Number(item.id)+','+(!enabled)+')">'+
    (enabled?"Disable":"Enable")+
    '</button>'+
    '<button class="danger" onclick="deleteContent('+Number(item.id)+')">Delete</button>'+
    '</div>';

   box.appendChild(div);
  });

 }catch(e){
  box.innerHTML=
   '<div class="status"><span class="err">Load failed: '+
   escapeHtml(e.message)+
   '</span></div>';
 }
}


async function toggleContent(id,enabled){
 try{
  const r=await fetch(API+"/api/admin/content/"+id,{
   method:"PATCH",
   headers:headers(true),
   body:JSON.stringify({enabled:enabled})
  });

  const t=await r.text();

  if(!r.ok)throw new Error(t||("HTTP "+r.status));

  loadContent();

 }catch(e){
  alert("Update failed: "+e.message);
 }
}


async function deleteContent(id){
 if(!confirm("Delete this content?"))return;

 try{
  const r=await fetch(API+"/api/admin/content/"+id,{
   method:"DELETE",
   headers:headers()
  });

  const t=await r.text();

  if(!r.ok)throw new Error(t||("HTTP "+r.status));

  loadContent();

 }catch(e){
  alert("Delete failed: "+e.message);
 }
}


async function uploadMedia(){
 const file=document.getElementById("mediaFile").files[0];

 if(!file){
  show("uploadStatus","Please select a file.");
  return;
 }

 const form=new FormData();
 form.append("file",file);

 try{
  const r=await fetch(API+"/api/admin/upload",{
   method:"POST",
   headers:{
    "Authorization":"Bearer "+token()
   },
   body:form
  });

  const data=await r.json();

  if(!r.ok){
   throw new Error(data.error||("HTTP "+r.status));
  }

  if(data.url){
   document.getElementById("url").value=data.url;
  }

  show(
   "uploadStatus",
   "Upload successful"+(data.url?": "+data.url:""),
   true
  );

 }catch(e){
  show("uploadStatus","Upload failed: "+e.message);
 }
}


async function checkSystem(){
 const box=document.getElementById("systemStatus");

 try{
  const r=await fetch("/api/home/content?refresh="+Date.now());
  const data=await r.json();

  if(!r.ok){
   throw new Error(data.error||("HTTP "+r.status));
  }

  box.innerHTML=
   '<span class="ok">✓ API Online</span>'+
   '<br>Homepage Enabled: '+(data.enabled?"Yes":"No")+
   '<br>Saved Items: '+(data.count??(data.items||[]).length);

 }catch(e){
  box.innerHTML=
   '<span class="err">✕ API Error: '+
   escapeHtml(e.message)+'</span>';
 }
}


loadContent();
checkSystem();
</script>

</body>
</html>
