<meta charset="UTF-8">    
  
<meta    
    name="viewport"    
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"    
>    
  
<title>MAYOTUBE ADMIN</title>    
  
<style>    
  
    * {    
        box-sizing: border-box;    
    }    
  
    html,    
    body {    
        margin: 0;    
        padding: 0;    
        background: #090909;    
        color: #ffffff;    
        font-family:    
            Arial,    
            "Noto Nastaliq Urdu",    
            "Noto Sans Arabic",    
            sans-serif;    
    }    
  
    body {    
        min-height: 100vh;    
    }    
  
    button,    
    input,    
    select,    
    textarea {    
        font-family: inherit;    
    }    
  
    button {    
        cursor: pointer;    
    }    
  
    .hidden {    
        display: none !important;    
    }    
  
    .container {    
        width: 100%;    
        max-width: 980px;    
        margin: auto;    
        padding: 14px;    
    }    
  
    /* =====================================================    
       LOGIN    
       ===================================================== */    
  
    #loginScreen {    
        min-height: 100vh;    
        display: flex;    
        align-items: center;    
        justify-content: center;    
        padding: 18px;    
        background:    
            radial-gradient(    
                circle at top,    
                #252525 0,    
                #090909 55%    
            );    
    }    
  
    .login-card {    
        width: 100%;    
        max-width: 430px;    
        background: #151515;    
        border: 1px solid #303030;    
        border-radius: 20px;    
        padding: 25px;    
        box-shadow: 0 20px 50px rgba(0, 0, 0, .45);    
    }    
  
    .login-logo {    
        text-align: center;    
        font-size: 27px;    
        font-weight: 900;    
        letter-spacing: 1px;    
        margin-bottom: 6px;    
    }    
  
    .login-subtitle {    
        text-align: center;    
        color: #999;    
        font-size: 13px;    
        margin-bottom: 25px;    
    }    
  
    /* =====================================================    
       INPUTS    
       ===================================================== */    
  
    .input-group {    
        margin-bottom: 12px;    
    }    
  
    .input-group label {    
        display: block;    
        color: #cfcfcf;    
        font-size: 13px;    
        font-weight: 700;    
        margin-bottom: 7px;    
    }    
  
    input,    
    select,    
    textarea {    
        width: 100%;    
        background: #0e0e0e;    
        border: 1px solid #333;    
        color: #fff;    
        border-radius: 10px;    
        padding: 12px;    
        outline: none;    
        font-size: 14px;    
    }    
  
    input:focus,    
    select:focus,    
    textarea:focus {    
        border-color: #7c3aed;    
        box-shadow: 0 0 0 2px rgba(124, 58, 237, .15);    
    }    
  
    textarea {    
        min-height: 100px;    
        resize: vertical;    
    }    
  
    .muted {    
        color: #777;    
        font-size: 11px;    
        margin-top: 5px;    
    }    
  
    .form-grid {    
        display: grid;    
        grid-template-columns: repeat(2, 1fr);    
        gap: 12px;    
    }    
  
    .form-grid-3 {    
        display: grid;    
        grid-template-columns: repeat(3, 1fr);    
        gap: 12px;    
    }    
  
    /* =====================================================    
       BUTTONS    
       ===================================================== */    
  
    .btn {    
        border: 0;    
        border-radius: 10px;    
        padding: 11px 15px;    
        color: #fff;    
        background: #272727;    
        font-size: 13px;    
        font-weight: 800;    
    }    
  
    .btn:hover {    
        filter: brightness(1.15);    
    }    
  
    .btn-primary {    
        background: #6d28d9;    
    }    
  
    .btn-success {    
        background: #15803d;    
    }    
  
    .btn-danger {    
        background: #b91c1c;    
    }    
  
    .btn-warning {    
        background: #a16207;    
    }    
  
    .btn-blue {    
        background: #1d4ed8;    
    }    
  
    .btn-small {    
        padding: 7px 10px;    
        font-size: 11px;    
    }    
  
    .button-row {    
        display: flex;    
        flex-wrap: wrap;    
        gap: 8px;    
        margin-top: 12px;    
    }    
  
    /* =====================================================    
       HEADER    
       ===================================================== */    
  
    .topbar {    
        background: #151515;    
        border: 1px solid #2d2d2d;    
        border-radius: 15px;    
        padding: 14px 16px;    
        display: flex;    
        justify-content: space-between;    
        align-items: center;    
        gap: 10px;    
        margin-bottom: 12px;    
    }    
  
    .brand {    
        font-size: 19px;    
        font-weight: 900;    
    }    
  
    .status {    
        display: flex;    
        align-items: center;    
        gap: 7px;    
        color: #aaa;    
        font-size: 12px;    
    }    
  
    .status-dot {    
        width: 9px;    
        height: 9px;    
        border-radius: 50%;    
        background: #22c55e;    
        box-shadow: 0 0 8px rgba(34, 197, 94, .6);    
    }    
  
    /* =====================================================    
       CARDS    
       ===================================================== */    
  
    .admin-card {    
        background: #151515;    
        border: 1px solid #2c2c2c;    
        border-radius: 16px;    
        padding: 15px;    
        margin-bottom: 13px;    
    }    
  
    .card-title {    
        font-size: 16px;    
        font-weight: 900;    
        margin-bottom: 13px;    
    }    
  
    .card-subtitle {    
        color: #888;    
        font-size: 12px;    
        margin-top: -8px;    
        margin-bottom: 14px;    
    }    
  
    /* =====================================================    
       HOME CONTROL    
       ===================================================== */    
  
    .home-control {    
        display: flex;    
        align-items: center;    
        justify-content: space-between;    
        gap: 15px;    
    }    
  
    .home-info strong {    
        display: block;    
        margin-bottom: 5px;    
    }    
  
    .home-info span {    
        color: #888;    
        font-size: 12px;    
    }    
  
    .switch {    
        position: relative;    
        width: 58px;    
        height: 32px;    
        flex-shrink: 0;    
    }    
  
    .switch input {    
        opacity: 0;    
        width: 0;    
        height: 0;    
    }    
  
    .slider {    
        position: absolute;    
        inset: 0;    
        background: #333;    
        border-radius: 30px;    
        transition: .2s;    
    }    
  
    .slider:before {    
        content: "";    
        position: absolute;    
        width: 24px;    
        height: 24px;    
        right: 4px;    
        top: 4px;    
        background: #fff;    
        border-radius: 50%;    
        transition: .2s;    
    }    
  
    .switch input:checked + .slider {    
        background: #16a34a;    
    }    
  
    .switch input:checked + .slider:before {    
        transform: translateX(-26px);    
    }    
  
    /* =====================================================    
       STATS    
       ===================================================== */    
  
    .stats-grid {    
        display: grid;    
        grid-template-columns: repeat(4, 1fr);    
        gap: 10px;    
    }    
  
    .stat {    
        background: #0e0e0e;    
        border: 1px solid #292929;    
        border-radius: 12px;    
        padding: 13px;    
        text-align: center;    
    }    
  
    .stat-number {    
        font-size: 22px;    
        font-weight: 900;    
        margin-bottom: 4px;    
    }    
  
    .stat-label {    
        color: #888;    
        font-size: 11px;    
    }    
  
    /* =====================================================    
       EDITOR    
       ===================================================== */    
  
    .editor-grid {    
        display: grid;    
        grid-template-columns: repeat(2, 1fr);    
        gap: 12px;    
    }    
  
    .full {    
        grid-column: 1 / -1;    
    }    
  
    /* =====================================================    
       BOX DESIGN CONTROLS    
       ===================================================== */    
  
    .design-controls {    
        background: #101010;    
        border: 1px solid #303030;    
        border-radius: 14px;    
        padding: 14px;    
        margin-top: 5px;    
    }    
  
    .design-controls-title {    
        font-size: 15px;    
        font-weight: 900;    
        margin-bottom: 13px;    
    }    
  
    .design-section {    
        border-top: 1px solid #292929;    
        padding-top: 13px;    
        margin-top: 13px;    
    }    
  
    .design-section:first-child {    
        border-top: 0;    
        padding-top: 0;    
        margin-top: 0;    
    }    
  
    .color-row {    
        display: flex;    
        align-items: center;    
        gap: 8px;    
    }    
  
    .color-row input[type="color"] {    
        width: 52px;    
        height: 43px;    
        padding: 3px;    
        border-radius: 9px;    
        cursor: pointer;    
    }    
  
    .range-value {    
        min-width: 65px;    
        text-align: center;    
        color: #a78bfa;    
        font-size: 12px;    
        font-weight: 800;    
    }    
  
    /* =====================================================    
       SCHEDULE    
       ===================================================== */    
  
    .schedule-box {    
        background: #0d0d0d;    
        border: 1px solid #292929;    
        border-radius: 12px;    
        padding: 12px;    
    }    
  
    .schedule-status {    
        margin-top: 8px;    
        font-size: 12px;    
        font-weight: 800;    
    }    
  
    .schedule-active {    
        color: #22c55e;    
    }    
  
    .schedule-inactive {    
        color: #ef4444;    
    }    
  
    /* =====================================================    
       LIST    
       ===================================================== */    
  
    .toolbar {    
        display: flex;    
        gap: 8px;    
        flex-wrap: wrap;    
        margin-bottom: 12px;    
    }    
  
    .toolbar input,    
    .toolbar select {    
        flex: 1;    
        min-width: 140px;    
    }    
  
    .items-list {    
        display: flex;    
        flex-direction: column;    
        gap: 10px;    
    }    
  
    .item-card {    
        background: #0e0e0e;    
        border: 1px solid #2c2c2c;    
        border-radius: 13px;    
        padding: 12px;    
        transition: .15s;    
    }    
  
    .item-card.dragging {    
        opacity: .45;    
        border-color: #7c3aed;    
    }    
  
    .item-card.drag-over {    
        border-color: #22c55e;    
        transform: scale(1.01);    
    }    
  
    .item-head {    
        display: flex;    
        align-items: flex-start;    
        gap: 10px;    
    }    
  
    .drag-handle {    
        cursor: grab;    
        color: #777;    
        font-size: 20px;    
        padding: 2px 5px;    
        user-select: none;    
    }    
  
    .drag-handle:active {    
        cursor: grabbing;    
    }    
  
    .item-main {    
        flex: 1;    
        min-width: 0;    
    }    
  
    .item-title {    
        font-size: 14px;    
        font-weight: 900;    
        word-break: break-word;    
    }    
  
    .item-meta {    
        display: flex;    
        flex-wrap: wrap;    
        gap: 5px;    
        margin-top: 6px;    
    }    
  
    .badge {    
        display: inline-flex;    
        padding: 4px 7px;    
        border-radius: 6px;    
        font-size: 10px;    
        font-weight: 800;    
        background: #252525;    
        color: #aaa;    
    }    
  
    .badge-green {    
        color: #86efac;    
        background: rgba(22, 101, 52, .3);    
    }    
  
    .badge-red {    
        color: #fca5a5;    
        background: rgba(127, 29, 29, .3);    
    }    
  
    .badge-purple {    
        color: #c4b5fd;    
        background: rgba(76, 29, 149, .3);    
    }    
  
    .item-preview {    
        margin-top: 9px;    
        color: #999;    
        font-size: 12px;    
        white-space: pre-wrap;    
        word-break: break-word;    
    }    
  
    .item-actions {    
        display: flex;    
        flex-wrap: wrap;    
        gap: 6px;    
        margin-top: 10px;    
    }    
  
    /* =====================================================    
       LIVE PREVIEW    
       ===================================================== */    
  
    .preview-wrapper {    
        background: #080808;    
        border: 1px solid #282828;    
        border-radius: 14px;    
        padding: 12px;    
        overflow: hidden;    
    }    
  
    .preview-phone {    
        max-width: 440px;    
        margin: auto;    
        background: #101010;    
        border-radius: 18px;    
        padding: 12px;    
        min-height: 200px;    
    }    
  
    .preview-card {    
        margin: 0 auto 12px;    
        overflow: hidden;    
        border: 1px solid rgba(255,255,255,.07);    
        transition: .15s;    
    }    
  
    .preview-card-title {    
        font-size: 16px;    
        font-weight: 900;    
        margin-bottom: 8px;    
    }    
  
    .preview-card-type {    
        color: #888;    
        font-size: 10px;    
        margin-bottom: 7px;    
    }    
  
    .preview-card-message {    
        font-size: 13px;    
        line-height: 1.8;    
        white-space: pre-wrap;    
        word-break: break-word;    
    }    
  
    .preview-card-image {    
        width: 100%;    
        display: block;    
        border-radius: 10px;    
        margin-top: 9px;    
        background: #080808;    
    }    
  
    .preview-card-video {    
        width: 100%;    
        max-height: 500px;    
        display: block;    
        border-radius: 10px;    
        margin-top: 9px;    
        background: #000;    
    }    
  
    .preview-card-link {    
        display: block;    
        margin-top: 9px;    
        color: #93c5fd;    
        word-break: break-all;    
        font-size: 12px;    
    }    
  
    .preview-card-button {    
        display: inline-block;    
        margin-top: 10px;    
        background: #6d28d9;    
        color: white;    
        padding: 9px 14px;    
        border-radius: 9px;    
        text-decoration: none;    
        font-size: 12px;    
        font-weight: 800;    
    }    
  
    .preview-empty {    
        text-align: center;    
        color: #777;    
        padding: 35px 10px;    
        font-size: 13px;    
    }    
  
    /* =====================================================    
       MEDIA    
       ===================================================== */    
  
    .media-grid {    
        display: grid;    
        grid-template-columns: repeat(3, 1fr);    
        gap: 10px;    
    }    
  
    .media-card {    
        background: #0e0e0e;    
        border: 1px solid #292929;    
        border-radius: 11px;    
        overflow: hidden;    
    }    
  
    .media-thumb {    
        width: 100%;    
        height: 120px;    
        object-fit: cover;    
        background: #050505;    
    }    
  
    .media-info {    
        padding: 8px;    
    }    
  
    .media-name {    
        font-size: 11px;    
        word-break: break-word;    
        color: #ccc;    
    }    
  
    /* =====================================================    
       RECYCLE BIN    
       ===================================================== */    
  
    .trash-card {    
        background: #130b0b;    
        border: 1px solid #452020;    
        border-radius: 12px;    
        padding: 11px;    
        margin-bottom: 8px;    
    }    
  
    /* =====================================================    
       TOAST    
       ===================================================== */    
  
    #toast {    
        position: fixed;    
        bottom: 20px;    
        left: 50%;    
        transform: translateX(-50%) translateY(100px);    
        background: #202020;    
        border: 1px solid #3b3b3b;    
        color: #fff;    
        padding: 12px 17px;    
        border-radius: 10px;    
        font-size: 13px;    
        font-weight: 700;    
        z-index: 99999;    
        opacity: 0;    
        transition: .25s;    
        max-width: calc(100% - 30px);    
        text-align: center;    
    }    
  
    #toast.show {    
        transform: translateX(-50%) translateY(0);    
        opacity: 1;    
    }    
  
    /* =====================================================    
       LOADING    
       ===================================================== */    
  
    .loading {    
        text-align: center;    
        padding: 20px;    
        color: #888;    
        font-size: 13px;    
    }    
  
    /* =====================================================    
       RESPONSIVE    
       ===================================================== */    
  
    @media (max-width: 700px) {    
  
        .container {    
            padding: 9px;    
        }    
  
        .editor-grid,    
        .form-grid,    
        .form-grid-3 {    
            grid-template-columns: 1fr;    
        }    
  
        .stats-grid {    
            grid-template-columns: repeat(2, 1fr);    
        }    
  
        .media-grid {    
            grid-template-columns: repeat(2, 1fr);    
        }    
  
        .topbar {    
            padding: 12px;    
        }    
  
        .brand {    
            font-size: 16px;    
        }    
  
        .admin-card {    
            padding: 12px;    
        }    
    }    
  
</style>
