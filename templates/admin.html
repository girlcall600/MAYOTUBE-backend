<script>

/* =========================================================
   GLOBAL
   ========================================================= */

let adminToken = "";

let cmsContent = {
    items: [],
    home_enabled: true
};

let draggedId = null;

const TRASH_KEY =
    "mayotube_admin_recycle_bin_v1";


function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;


function showToast(message) {

    const toast = $("toast");

    if (!toast) {
        console.log(message);
        return;
    }

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    }, 2800);

}


/* =========================================================
   SAFE HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   URL SAFETY
   ========================================================= */

function safePreviewUrl(value) {

    if (!value) {
        return "";
    }

    try {

        const url = new URL(value);

        if (
            url.protocol === "http:" ||
            url.protocol === "https:"
        ) {

            return url.href;

        }

    } catch (e) {}

    return "";

}


/* =========================================================
   API
   ========================================================= */

async function api(path, options = {}) {

    const headers = {
        ...(options.headers || {}),
        "Authorization": "Bearer " + adminToken
    };

    if (
        options.body &&
        !(options.body instanceof FormData)
    ) {

        headers["Content-Type"] =
            "application/json";

    }

    const response =
        await fetch(
            path,
            {
                ...options,
                headers
            }
        );

    const text =
        await response.text();

    let data;

    try {

        data =
            JSON.parse(text);

    } catch (e) {

        data = {
            raw: text
        };

    }

    if (!response.ok) {

        throw new Error(
            data.message ||
            data.error ||
            data.raw ||
            "Request failed"
        );

    }

    return data;

}


/* =========================================================
   LOGIN
   ========================================================= */

function login() {

    const tokenInput =
        $("tokenInput");

    const loginError =
        $("loginError");

    const rememberToken =
        $("rememberToken");

    const loginScreen =
        $("loginScreen");

    const app =
        $("app");


    if (!tokenInput) {

        console.error(
            "tokenInput element not found."
        );

        return;

    }


    const token =
        tokenInput.value.trim();


    if (!token) {

        if (loginError) {

            loginError.textContent =
                "Admin Token درج کریں۔";

        }

        return;

    }


    adminToken =
        token;


    if (
        rememberToken &&
        rememberToken.checked
    ) {

        localStorage.setItem(
            "mayotube_admin_token",
            token
        );

    } else {

        localStorage.removeItem(
            "mayotube_admin_token"
        );

    }


    if (loginError) {

        loginError.textContent =
            "";

    }


    if (loginScreen) {

        loginScreen.classList.add(
            "hidden"
        );

    }


    if (app) {

        app.classList.remove(
            "hidden"
        );

    }


    initialize();

}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

    adminToken =
        "";


    localStorage.removeItem(
        "mayotube_admin_token"
    );


    sessionStorage.removeItem(
        "mayotube_admin_token"
    );


    const app =
        $("app");

    const loginScreen =
        $("loginScreen");

    const tokenInput =
        $("tokenInput");


    if (app) {

        app.classList.add(
            "hidden"
        );

    }


    if (loginScreen) {

        loginScreen.classList.remove(
            "hidden"
        );

    }


    if (tokenInput) {

        tokenInput.value =
            "";

    }

}


/* =========================================================
   INIT
   ========================================================= */

async function initialize() {

    updateColorLabels();


    const boxBackgroundColor =
        $("boxBackgroundColor");

    const boxTextColor =
        $("boxTextColor");

    const buttonColor =
        $("buttonColor");

    const buttonTextColor =
        $("buttonTextColor");

    const scheduleStart =
        $("scheduleStart");

    const scheduleEnd =
        $("scheduleEnd");


    if (boxBackgroundColor) {

        boxBackgroundColor.addEventListener(
            "input",
            updateColorLabels
        );

    }


    if (boxTextColor) {

        boxTextColor.addEventListener(
            "input",
            updateColorLabels
        );

    }


    if (buttonColor) {

        buttonColor.addEventListener(
            "input",
            updateColorLabels
        );

    }


    if (buttonTextColor) {

        buttonTextColor.addEventListener(
            "input",
            updateColorLabels
        );

    }


    if (scheduleStart) {

        scheduleStart.addEventListener(
            "change",
            updateScheduleStatus
        );

    }


    if (scheduleEnd) {

        scheduleEnd.addEventListener(
            "change",
            updateScheduleStatus
        );

    }


    clearForm();

    await loadAll();

}


/* =========================================================
   LOAD ALL
   ========================================================= */

async function loadAll() {

    try {

        await loadContent();

        await loadHomePreview();

        await loadMedia();

        await loadStatus();


        const connectionText =
            $("connectionText");


        if (connectionText) {

            connectionText.textContent =
                "Connected";

        }


    } catch (error) {

        console.error(error);


        const connectionText =
            $("connectionText");


        if (connectionText) {

            connectionText.textContent =
                "Connection Error";

        }


        showToast(
            "Error: " +
            error.message
        );

    }

}


/* =========================================================
   CONTENT
   ========================================================= */

async function loadContent() {

    const data =
        await api(
            "/api/admin/content"
        );


    cmsContent =
        data || {};


    if (
        !Array.isArray(
            cmsContent.items
        )
    ) {

        cmsContent.items = [];

    }


    cmsContent.items.sort(
        (a, b) =>
            Number(a.order || 0) -
            Number(b.order || 0)
    );


    const homeEnabled =
        $("homeEnabled");

    const homeStatusText =
        $("homeStatusText");


    if (homeEnabled) {

        homeEnabled.checked =
            cmsContent.home_enabled !== false;

    }


    if (homeStatusText) {

        homeStatusText.textContent =
            cmsContent.home_enabled !== false
                ? "Home content is ON"
                : "Home content is OFF";

    }


    updateStats();

    renderItems();

    renderTrash();

}


/* =========================================================
   RECYCLE BIN STORAGE
   ========================================================= */

function getTrash() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    TRASH_KEY
                ) || "[]"
            );


        return Array.isArray(data)
            ? data
            : [];


    } catch (e) {

        console.error(
            "Recycle Bin read error:",
            e
        );

        return [];

    }

}


function setTrash(items) {

    localStorage.setItem(
        TRASH_KEY,
        JSON.stringify(
            Array.isArray(items)
                ? items
                : []
        )
    );


    updateStats();

}


/* =========================================================
   CHECK IF ITEM IS IN RECYCLE BIN
   ========================================================= */

function isInTrash(id) {

    return getTrash().some(
        record =>
            String(
                record?.item?.id
            ) === String(id)
    );

}


/* =========================================================
   GET VISIBLE CONTENT
   ========================================================= */

function getVisibleContentItems() {

    const trashIds =
        new Set(
            getTrash().map(
                record =>
                    String(
                        record?.item?.id
                    )
            )
        );


    return (
        cmsContent.items || []
    ).filter(
        item =>
            !trashIds.has(
                String(item.id)
            )
    );

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

    const items =
        getVisibleContentItems();


    const enabled =
        items.filter(
            item =>
                item.enabled !== false
        ).length;


    const disabled =
        items.filter(
            item =>
                item.enabled === false
        ).length;


    const statTotal =
        $("statTotal");

    const statEnabled =
        $("statEnabled");

    const statDisabled =
        $("statDisabled");

    const statTrash =
        $("statTrash");


    if (statTotal) {

        statTotal.textContent =
            items.length;

    }


    if (statEnabled) {

        statEnabled.textContent =
            enabled;

    }


    if (statDisabled) {

        statDisabled.textContent =
            disabled;

    }


    if (statTrash) {

        statTrash.textContent =
            getTrash().length;

    }

}


/* =========================================================
   HOME TOGGLE
   ========================================================= */

async function toggleHome() {

    const homeEnabled =
        $("homeEnabled");


    if (!homeEnabled) {
        return;
    }


    const enabled =
        homeEnabled.checked;


    try {

        await api(
            "/api/admin/home/toggle",
            {
                method:
                    "PATCH",

                body:
                    JSON.stringify({
                        enabled
                    })
            }
        );


        const homeStatusText =
            $("homeStatusText");


        if (homeStatusText) {

            homeStatusText.textContent =
                enabled
                    ? "Home content is ON"
                    : "Home content is OFF";

        }


        showToast(
            enabled
                ? "Home ON کر دیا گیا۔"
                : "Home OFF کر دیا گیا۔"
        );


        await loadHomePreview();


    } catch (error) {

        homeEnabled.checked =
            !enabled;


        showToast(
            "Home toggle failed: " +
            error.message
        );

    }

}


/* =========================================================
   EDITOR FIELDS
   ========================================================= */

function updateEditorFields() {

    const itemType =
        $("itemType");


    if (!itemType) {
        return;
    }


    const type =
        itemType.value;


    const imageTypes = [
        "image",
        "donation",
        "advertisement"
    ];


    const videoTypes = [
        "video"
    ];


    const linkTypes = [
        "button",
        "link",
        "website",
        "youtube",
        "channel",
        "donation",
        "advertisement"
    ];


    const fieldImageUrl =
        $("fieldImageUrl");

    const fieldVideoUrl =
        $("fieldVideoUrl");

    const fieldLinkUrl =
        $("fieldLinkUrl");

    const fieldButtonText =
        $("fieldButtonText");


    if (fieldImageUrl) {

        fieldImageUrl.style.display =
            imageTypes.includes(type)
                ? ""
                : "none";

    }


    if (fieldVideoUrl) {

        fieldVideoUrl.style.display =
            videoTypes.includes(type)
                ? ""
                : "none";

    }


    if (fieldLinkUrl) {

        fieldLinkUrl.style.display =
            linkTypes.includes(type)
                ? ""
                : "none";

    }


    if (fieldButtonText) {

        fieldButtonText.style.display =
            [
                "button",
                "donation",
                "advertisement"
            ].includes(type)
                ? ""
                : "none";

    }

}


/* =========================================================
   BOX DESIGN
   ========================================================= */

function getBoxStyleFromForm() {

    return {

        boxStyle:
            $("boxStyle")?.value ||
            "card",

        backgroundColor:
            $("boxBackgroundColor")?.value ||
            "#181818",

        textColor:
            $("boxTextColor")?.value ||
            "#ffffff",

        textAlign:
            $("boxTextAlign")?.value ||
            "right",

        borderRadius:
            Number(
                $("boxRadius")?.value ||
                13
            ),

        boxHeight:
            Number(
                $("boxHeight")?.value ||
                0
            ),

        boxWidth:
            Number(
                $("boxWidth")?.value ||
                100
            ),

        padding:
            Number(
                $("boxPadding")?.value ||
                11
            ),

        shadow:
            $("boxShadow")?.value ||
            "medium",

        border:
            $("boxBorder")?.value ||
            "subtle",

        imageHeight:
            Number(
                $("imageHeight")?.value ||
                230
            ),

        imageFit:
            $("boxImageFit")?.value ||
            "cover",

        videoHeight:
            Number(
                $("videoHeight")?.value ||
                240
            ),

        videoFit:
            $("videoFit")?.value ||
            "contain",

        videoAutoplay:
            $("videoAutoplay")?.checked ||
            false,

        videoLoop:
            $("videoLoop")?.checked ||
            false,

        buttonColor:
            $("buttonColor")?.value ||
            "#6d28d9",

        buttonTextColor:
            $("buttonTextColor")?.value ||
            "#ffffff"

    };

}


/* =========================================================
   APPLY DESIGN
   ========================================================= */

function applyBoxStyleToForm(style) {

    style =
        style || {};


    const setValue = (
        id,
        value
    ) => {

        const el =
            $(id);

        if (el) {

            el.value =
                value;

        }

    };


    const setChecked = (
        id,
        value
    ) => {

        const el =
            $(id);

        if (el) {

            el.checked =
                value;

        }

    };


    setValue(
        "boxStyle",
        style.boxStyle || "card"
    );


    setValue(
        "boxBackgroundColor",
        style.backgroundColor || "#181818"
    );


    setValue(
        "boxTextColor",
        style.textColor || "#ffffff"
    );


    setValue(
        "boxTextAlign",
        style.textAlign || "right"
    );


    setValue(
        "boxRadius",
        style.borderRadius !== undefined
            ? style.borderRadius
            : 13
    );


    setValue(
        "boxHeight",
        style.boxHeight !== undefined
            ? style.boxHeight
            : 0
    );


    setValue(
        "boxWidth",
        style.boxWidth !== undefined
            ? style.boxWidth
            : 100
    );


    setValue(
        "boxPadding",
        style.padding !== undefined
            ? style.padding
            : 11
    );


    setValue(
        "boxShadow",
        style.shadow || "medium"
    );


    setValue(
        "boxBorder",
        style.border || "subtle"
    );


    setValue(
        "imageHeight",
        style.imageHeight !== undefined
            ? style.imageHeight
            : 230
    );


    setValue(
        "boxImageFit",
        style.imageFit || "cover"
    );


    setValue(
        "videoHeight",
        style.videoHeight !== undefined
            ? style.videoHeight
            : 240
    );


    setValue(
        "videoFit",
        style.videoFit || "contain"
    );


    setChecked(
        "videoAutoplay",
        style.videoAutoplay === true
    );


    setChecked(
        "videoLoop",
        style.videoLoop === true
    );


    setValue(
        "buttonColor",
        style.buttonColor || "#6d28d9"
    );


    setValue(
        "buttonTextColor",
        style.buttonTextColor || "#ffffff"
    );


    updateColorLabels();

}


/* =========================================================
   COLOR LABELS
   ========================================================= */

function updateColorLabels() {

    const fields = [

        [
            "boxBackgroundColor",
            "boxBackgroundColorValue"
        ],

        [
            "boxTextColor",
            "boxTextColorValue"
        ],

        [
            "buttonColor",
            "buttonColorValue"
        ],

        [
            "buttonTextColor",
            "buttonTextColorValue"
        ]

    ];


    fields.forEach(
        pair => {

            const input =
                $(pair[0]);

            const label =
                $(pair[1]);


            if (
                input &&
                label
            ) {

                label.textContent =
                    input.value;

            }

        }
    );

}


/* =========================================================
   PREVIEW SHADOW
   ========================================================= */

function getPreviewShadow(shadow) {

    switch (shadow) {

        case "small":
            return "0 2px 8px rgba(0,0,0,.25)";

        case "medium":
            return "0 6px 18px rgba(0,0,0,.35)";

        case "large":
            return "0 10px 30px rgba(0,0,0,.50)";

        default:
            return "none";

    }

}


/* =========================================================
   PREVIEW BOX STYLE
   ========================================================= */

function getPreviewBoxStyle(item) {

    const style =
        item.style || {};


    const boxStyle =
        style.boxStyle ||
        "card";


    let background =
        style.backgroundColor ||
        "#181818";


    if (boxStyle === "flat") {

        background =
            style.backgroundColor ||
            "#101010";

    }


    if (boxStyle === "transparent") {

        background =
            "transparent";

    }


    const width =
        Math.max(
            10,
            Math.min(
                100,
                Number(
                    style.boxWidth || 100
                )
            )
        );


    const height =
        Number(
            style.boxHeight || 0
        );


    const padding =
        Number(
            style.padding || 11
        );


    const radius =
        Number(
            style.borderRadius || 13
        );


    const textColor =
        style.textColor ||
        "#ffffff";


    const textAlign =
        style.textAlign ||
        "right";


    let border =
        "1px solid rgba(255,255,255,.07)";


    if (style.border === "none") {

        border =
            "none";

    }


    if (style.border === "strong") {

        border =
            "1px solid rgba(255,255,255,.22)";

    }


    return {

        background,

        width:
            width + "%",

        minHeight:
            height > 0
                ? height + "px"
                : "auto",

        padding:
            padding + "px",

        borderRadius:
            radius + "px",

        boxShadow:
            getPreviewShadow(
                style.shadow ||
                "medium"
            ),

        border,

        color:
            textColor,

        textAlign

    };

}


/* =========================================================
   CLEAR FORM
   ========================================================= */

function clearForm() {

    const setValue = (
        id,
        value
    ) => {

        const el =
            $(id);

        if (el) {

            el.value =
                value;

        }

    };


    const setChecked = (
        id,
        value
    ) => {

        const el =
            $(id);

        if (el) {

            el.checked =
                value;

        }

    };


    setValue(
        "itemId",
        ""
    );


    setValue(
        "itemType",
        "message"
    );


    setValue(
        "itemOrder",
        getNextOrder()
    );


    setValue(
        "itemTitle",
        ""
    );


    setValue(
        "itemMessage",
        ""
    );


    setValue(
        "itemDescription",
        ""
    );


    setValue(
        "imageUrl",
        ""
    );


    setValue(
        "videoUrl",
        ""
    );


    setValue(
        "linkUrl",
        ""
    );


    setValue(
        "buttonText",
        ""
    );


    setChecked(
        "itemEnabled",
        true
    );


    applyBoxStyleToForm({

        boxStyle:
            "card",

        backgroundColor:
            "#181818",

        textColor:
            "#ffffff",

        textAlign:
            "right",

        borderRadius:
            13,

        boxHeight:
            0,

        boxWidth:
            100,

        padding:
            11,

        shadow:
            "medium",

        border:
            "subtle",

        imageHeight:
            230,

        imageFit:
            "cover",

        videoHeight:
            240,

        videoFit:
            "contain",

        videoAutoplay:
            false,

        videoLoop:
            false,

        buttonColor:
            "#6d28d9",

        buttonTextColor:
            "#ffffff"

    });


    setValue(
        "scheduleStart",
        ""
    );


    setValue(
        "scheduleEnd",
        ""
    );


    updateScheduleStatus();

    updateEditorFields();

}


/* =========================================================
   NEXT ORDER
   ========================================================= */

function getNextOrder() {

    const items =
        getVisibleContentItems();


    if (!items.length) {

        return 1;

    }


    return Math.max(
        ...items.map(
            item =>
                Number(
                    item.order || 0
                )
        )
    ) + 1;

}


/* =========================================================
   EDIT ITEM
   ========================================================= */

function editItem(id) {

    const item =
        cmsContent.items.find(
            x =>
                String(x.id) ===
                String(id)
        );


    if (!item) {

        return;

    }


    if (isInTrash(id)) {

        showToast(
            "یہ content Recycle Bin میں ہے۔ پہلے Restore کریں۔"
        );

        return;

    }


    const fields = {

        itemId:
            item.id || "",

        itemType:
            item.type || "message",

        itemOrder:
            item.order !== undefined
                ? item.order
                : 0,

        itemTitle:
            item.title || "",

        itemMessage:
            item.message || "",

        itemDescription:
            item.description || "",

        imageUrl:
            item.image_url || "",

        videoUrl:
            item.video_url || "",

        linkUrl:
            item.link_url || "",

        buttonText:
            item.button_text || ""

    };


    Object.keys(fields).forEach(
        id => {

            const el =
                $(id);

            if (el) {

                el.value =
                    fields[id];

            }

        }
    );


    const itemEnabled =
        $("itemEnabled");


    if (itemEnabled) {

        itemEnabled.checked =
            item.enabled !== false;

    }


    applyBoxStyleToForm(
        item.style || {}
    );


    const schedule =
        item.schedule || {};


    const scheduleStart =
        $("scheduleStart");

    const scheduleEnd =
        $("scheduleEnd");


    if (scheduleStart) {

        scheduleStart.value =
            schedule.start || "";

    }


    if (scheduleEnd) {

        scheduleEnd.value =
            schedule.end || "";

    }


    updateScheduleStatus();

    updateEditorFields();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    showToast(
        "Content edit mode میں ہے۔"
    );

}


/* =========================================================
   SAVE ITEM
   ========================================================= */

async function saveItem() {

    const itemId =
        $("itemId");


    const id =
        itemId
            ? itemId.value.trim()
            : "";


    if (
        id &&
        isInTrash(id)
    ) {

        showToast(
            "Recycle Bin والے content کو پہلے Restore کریں۔"
        );

        return;

    }


    const item = {

        type:
            $("itemType")?.value ||
            "message",

        title:
            $("itemTitle")?.value.trim() ||
            "",

        message:
            $("itemMessage")?.value.trim() ||
            "",

        description:
            $("itemDescription")?.value.trim() ||
            "",

        image_url:
            $("imageUrl")?.value.trim() ||
            "",

        video_url:
            $("videoUrl")?.value.trim() ||
            "",

        link_url:
            $("linkUrl")?.value.trim() ||
            "",

        button_text:
            $("buttonText")?.value.trim() ||
            "",

        order:
            Number(
                $("itemOrder")?.value ||
                0
            ),

        enabled:
            $("itemEnabled")?.checked !== false,

        style:
            getBoxStyleFromForm(),

        schedule: {

            start:
                $("scheduleStart")?.value ||
                "",

            end:
                $("scheduleEnd")?.value ||
                ""

        }

    };


    try {

        if (id) {

            await api(
                "/api/admin/content/" +
                encodeURIComponent(id),
                {
                    method:
                        "PUT",

                    body:
                        JSON.stringify(item)
                }
            );


        } else {

            await api(
                "/api/admin/content",
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify(item)
                }
            );

        }


        showToast(
            id
                ? "Content update ہو گیا۔"
                : "Content create ہو گیا."
        );


        clearForm();

        await loadContent();

        await loadHomePreview();


    } catch (error) {

        console.error(error);


        showToast(
            "Save failed: " +
            error.message
        );

    }

}


/* =========================================================
   ENABLE / DISABLE
   ========================================================= */

async function toggleItem(id) {

    if (isInTrash(id)) {

        showToast(

/* =========================================================
   EMPTY RECYCLE BIN
   ========================================================= */

async function emptyTrash() {

    const trash =
        getTrash();


    if (!trash.length) {

        showToast(
            "Recycle Bin پہلے ہی خالی ہے۔"
        );

        return;

    }


    if (
        !confirm(
            "کیا آپ واقعی Recycle Bin کے تمام items کو ہمیشہ کے لیے delete کرنا چاہتے ہیں؟\n\nیہ عمل واپس نہیں کیا جا سکے گا۔"
        )
    ) {

        return;

    }


    const remaining = [];

    let deletedCount =
        0;


    for (
        const record of trash
    ) {

        const item =
            record?.item;


        if (!item?.id) {

            deletedCount++;

            continue;

        }


        try {

            await api(
                "/api/admin/content/" +
                encodeURIComponent(
                    item.id
                ),
                {
                    method:
                        "DELETE"
                }
            );


            deletedCount++;


        } catch (error) {

            remaining.push(
                record
            );


            console.error(
                "Permanent delete failed:",
                item.id,
                error
            );

        }

    }


    setTrash(
        remaining
    );


    await loadContent();

    await loadHomePreview();

    renderTrash();


    if (remaining.length) {

        showToast(
            deletedCount +
            " item delete ہوئے، " +
            remaining.length +
            " item باقی رہ گئے۔"
        );


    } else {

        showToast(
            "Recycle Bin مکمل خالی کر دیا گیا۔"
        );

    }

}

/* =========================================================
   SEARCH / FILTER
   ========================================================= */

function getFilteredItems() {

    let items =
        getVisibleContentItems();


    const searchInput =
        $("searchItems");

    const filterType =
        $("filterType");

    const filterStatus =
        $("filterStatus");


    const search =
        (
            searchInput?.value ||
            ""
        )
        .trim()
        .toLowerCase();


    const type =
        filterType?.value ||
        "all";


    const status =
        filterStatus?.value ||
        "all";


    if (search) {

        items =
            items.filter(
                item => {

                    const text = [

                        item.title,

                        item.message,

                        item.description,

                        item.type,

                        item.link_url

                    ]
                    .join(" ")
                    .toLowerCase();


                    return text.includes(
                        search
                    );

                }
            );

    }


    if (type !== "all") {

        items =
            items.filter(
                item =>
                    item.type === type
            );

    }


    if (status === "enabled") {

        items =
            items.filter(
                item =>
                    item.enabled !== false
            );

    }


    if (status === "disabled") {

        items =
            items.filter(
                item =>
                    item.enabled === false
            );

    }


    if (status === "scheduled") {

        items =
            items.filter(
                item =>
                    hasSchedule(item)
            );

    }


    items.sort(
        (a, b) =>
            Number(
                a.order || 0
            ) -
            Number(
                b.order || 0
            )
    );


    return items;

}

/* =========================================================
   DRAG & DROP
   ========================================================= */

function setupDragAndDrop() {

    const cards =
        document.querySelectorAll(
            ".item-card"
        );


    cards.forEach(
        card => {

            card.addEventListener(
                "dragstart",
                () => {

                    draggedId =
                        card.dataset.id;

                    card.classList.add(
                        "dragging"
                    );

                }
            );


            card.addEventListener(
                "dragend",
                () => {

                    card.classList.remove(
                        "dragging"
                    );


                    document
                        .querySelectorAll(
                            ".item-card"
                        )
                        .forEach(
                            c =>
                                c.classList.remove(
                                    "drag-over"
                                )
                        );


                    draggedId =
                        null;

                }
            );


            card.addEventListener(
                "dragover",
                event => {

                    event.preventDefault();

                    card.classList.add(
                        "drag-over"
                    );

                }
            );


            card.addEventListener(
                "dragleave",
                () => {

                    card.classList.remove(
                        "drag-over"
                    );

                }
            );


            card.addEventListener(
                "drop",
                async event => {

                    event.preventDefault();

                    card.classList.remove(
                        "drag-over"
                    );


                    const targetId =
                        card.dataset.id;


                    if (
                        !draggedId ||
                        draggedId === targetId
                    ) {

                        return;

                    }


                    await reorderItems(
                        draggedId,
                        targetId
                    );

                }
            );

        }
    );

}


/* =========================================================
   REORDER
   ========================================================= */

async function reorderItems(
    draggedId,
    targetId
) {

    const items =
        [...getVisibleContentItems()];


    const fromIndex =
        items.findIndex(
            x =>
                String(x.id) ===
                String(draggedId)
        );


    const toIndex =
        items.findIndex(
            x =>
                String(x.id) ===
                String(targetId)
        );


    if (
        fromIndex < 0 ||
        toIndex < 0
    ) {

        return;

    }


    const [moved] =
        items.splice(
            fromIndex,
            1
        );


    items.splice(
        toIndex,
        0,
        moved
    );


    items.forEach(
        (item, index) => {

            item.order =
                index + 1;

        }
    );


    try {

        for (
            const item of items
        ) {

            await api(
                "/api/admin/content/" +
                encodeURIComponent(
                    item.id
                ),
                {
                    method:
                        "PUT",

                    body:
                        JSON.stringify({

                            type:
                                item.type ||
                                "message",

                            title:
                                item.title ||
                                "",

                            message:
                                item.message ||
                                "",

                            description:
                                item.description ||
                                "",

                            image_url:
                                item.image_url ||
                                "",

                            video_url:
                                item.video_url ||
                                "",

                            link_url:
                                item.link_url ||
                                "",

                            button_text:
                                item.button_text ||
                                "",

                            order:
                                item.order,

                            enabled:
                                item.enabled !== false,

                            style:
                                item.style ||
                                {},

                            schedule:
                                item.schedule ||
                                {}

                        })
                }
            );

        }


        const trashIds =
            new Set(
                getTrash().map(
                    record =>
                        String(
                            record?.item?.id
                        )
                )
            );


        const trashItems =
            cmsContent.items.filter(
                item =>
                    trashIds.has(
                        String(item.id)
                    )
            );


        cmsContent.items =
            [
                ...items,
                ...trashItems
            ];


        cmsContent.items.sort(
            (a, b) =>
                Number(
                    a.order || 0
                ) -
                Number(
                    b.order || 0
                )
        );


        renderItems();

        await loadHomePreview();


        showToast(
            "Content order update ہو گیا۔"
        );


    } catch (error) {

        showToast(
            "Order update failed: " +
            error.message
        );


        await loadContent();

    }

}


/* =========================================================
   SCHEDULE
   ========================================================= */

function hasSchedule(item) {

    const schedule =
        item.schedule || {};


    return Boolean(
        schedule.start ||
        schedule.end
    );

}


function isScheduleActive(item) {

    const schedule =
        item.schedule || {};


    const now =
        new Date();


    if (schedule.start) {

        const start =
            new Date(
                schedule.start
            );


        if (
            !isNaN(
                start.getTime()
            ) &&
            now < start
        ) {

            return false;

        }

    }


    if (schedule.end) {

        const end =
            new Date(
                schedule.end
            );


        if (
            !isNaN(
                end.getTime()
            ) &&
            now > end
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   SCHEDULE STATUS
   ========================================================= */

function updateScheduleStatus() {

    const scheduleStart =
        $("scheduleStart");

    const scheduleEnd =
        $("scheduleEnd");

    const status =
        $("scheduleStatus");


    if (
        !scheduleStart ||
        !scheduleEnd ||
        !status
    ) {

        return;

    }


    const start =
        scheduleStart.value;


    const end =
        scheduleEnd.value;


    if (
        !start &&
        !end
    ) {

        status.textContent =
            "No schedule";


        status.className =
            "schedule-status";


        return;

    }


    const now =
        new Date();


    let active =
        true;


    if (start) {

        const startDate =
            new Date(start);


        if (
            !isNaN(
                startDate.getTime()
            ) &&
            now < startDate
        ) {

            active =
                false;

        }

    }


    if (end) {

        const endDate =
            new Date(end);


        if (
            !isNaN(
                endDate.getTime()
            ) &&
            now > endDate
        ) {

            active =
                false;

        }

    }


    status.textContent =
        active
            ? "🟢 Schedule ابھی active ہے"
            : "🔴 Schedule ابھی active نہیں ہے";


    status.className =
        "schedule-status " +
        (
            active
                ? "schedule-active"
                : "schedule-inactive"
        );

}

        data &&
        Array.isArray(data.items)
            ? data.items
            : Array.isArray(data)
                ? data
                : [];


    items =
        items
            .filter(
                item =>
                    item.enabled !== false
            )
            .filter(
                item =>
                    isScheduleActive(item)
            )
            .sort(
                (a, b) =>
                    Number(
                        a.order || 0
                    ) -
                    Number(
                        b.order || 0
                    )
            );


    if (!items.length) {

        container.innerHTML =
            '<div class="preview-empty">' +
                'Home پر ابھی کوئی active content نہیں ہے۔' +
            '</div>';


        return;

    }


    container.innerHTML =
        items.map(
            item =>
                buildPreviewCard(item)
        ).join("");

}


/* =========================================================
   BUILD PREVIEW CARD
   ========================================================= */

function buildPreviewCard(item) {

    const design =
        getPreviewBoxStyle(item);


    const style =
        item.style || {};


    const imageHeight =
        Number(
            style.imageHeight !== undefined
                ? style.imageHeight
                : 230
        );


    const imageFit =
        style.imageFit ||
        "cover";


    const videoHeight =
        Number(
            style.videoHeight !== undefined
                ? style.videoHeight
                : 240
        );


    const videoFit =
        style.videoFit ||
        "contain";


    const imageUrl =
        safePreviewUrl(
            item.image_url
        );


    const videoUrl =
        safePreviewUrl(
            item.video_url
        );


    const linkUrl =
        safePreviewUrl(
            item.link_url
        );


    const buttonColor =
        style.buttonColor ||
        "#6d28d9";


    const buttonTextColor =
        style.buttonTextColor ||
        "#ffffff";


    let html =

        '<div class="preview-card"' +

            ' style="' +

                'background:' +
                escapeHtml(
                    design.background
                ) +
                ';' +

                'width:' +
                escapeHtml(
                    design.width
                ) +
                ';' +

                'min-height:' +
                escapeHtml(
                    design.minHeight
                ) +
                ';' +

                'padding:' +
                escapeHtml(
                    design.padding
                ) +
                ';' +

                'border-radius:' +
                escapeHtml(
                    design.borderRadius
                ) +
                ';' +

                'box-shadow:' +
                escapeHtml(
                    design.boxShadow
                ) +
                ';' +

                'border:' +
                escapeHtml(
                    design.border
                ) +
                ';' +

                'color:' +
                escapeHtml(
                    design.color
                ) +
                ';' +

                'text-align:' +
                escapeHtml(
                    design.textAlign
                ) +

            '"' +

        '>';


    if (item.title) {

        html +=

            '<div class="preview-card-title">' +

                escapeHtml(
                    item.title
                ) +

            '</div>';

    }


    html +=

        '<div class="preview-card-type">' +

            escapeHtml(
                item.type ||
                ""
            ) +

        '</div>';


    if (item.message) {

        html +=

            '<div class="preview-card-message">' +

                escapeHtml(
                    item.message
                ) +

            '</div>';

    }


    if (item.description) {

        html +=

            '<div class="preview-card-message">' +

                escapeHtml(
                    item.description
                ) +

            '</div>';

    }


    if (imageUrl) {

        html +=

            '<img' +

                ' class="preview-card-image"' +

                ' src="' +
                    escapeHtml(
                        imageUrl
                    ) +
                '"' +

                ' style="' +

                    'height:' +
                    escapeHtml(
                        imageHeight +
                        "px"
                    ) +
                    ';' +

                    'object-fit:' +
                    escapeHtml(
                        imageFit
                    ) +
                    ';' +

                '"' +

                ' loading="lazy"' +

                ' onerror="this.style.display=\'none\'"' +

            '>';

    }


    if (videoUrl) {

        html +=

            '<video' +

                ' class="preview-card-video"' +

                ' src="' +
                    escapeHtml(
                        videoUrl
                    ) +
                '"' +

                ' controls' +

                ' preload="metadata"' +

                ' style="' +

                    'height:' +
                    escapeHtml(
                        videoHeight +
                        "px"
                    ) +
                    ';' +

                    'object-fit:' +
                    escapeHtml(
                        videoFit
                    ) +
                    ';' +

                '"' +

                (
                    style.videoAutoplay
                        ? " autoplay muted"
                        : ""
                ) +

                (
                    style.videoLoop
                        ? " loop"
                        : ""
                ) +

            '></video>';

    }


    if (linkUrl) {

        html +=

            '<a' +

                ' class="preview-card-link"' +

                ' href="' +
                    escapeHtml(
                        linkUrl
                    ) +
                '"' +

                ' target="_blank"' +

                ' rel="noopener noreferrer"' +

            '>' +

                escapeHtml(
                    item.link_url
                ) +

            '</a>';

    }


    if (
        item.button_text &&
        linkUrl
    ) {

        html +=

            '<a' +

                ' class="preview-card-button"' +

                ' href="' +
                    escapeHtml(
                        linkUrl
                    ) +
                '"' +

                ' target="_blank"' +

                ' rel="noopener noreferrer"' +

                ' style="' +

                    'background:' +
                    escapeHtml(
                        buttonColor
                    ) +
                    ';' +

                    'color:' +
                    escapeHtml(
                        buttonTextColor
                    ) +

                '"' +

            '>' +

                escapeHtml(
                    item.button_text
                ) +

            '</a>';

    }


    html +=
        "</div>";


    return html;

}


/* =========================================================
   MEDIA
   ========================================================= */

async function loadMedia() {

    const container =
        $("mediaList");


    if (!container) {
        return;
    }


    try {

        const data =
            await api(
                "/api/admin/media"
            );


        const media =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data?.media
                    )
                        ? data.media
                        : []
                );


        renderMedia(
            media
        );


    } catch (error) {

        container.innerHTML =
            '<div class="loading">' +

                escapeHtml(
                    error.message
                ) +

            '</div>';

    }

}


/* =========================================================
   RENDER MEDIA
   ========================================================= */

function renderMedia(media) {

    const container =
        $("mediaList");


    if (!container) {
        return;
    }


    if (!media.length) {

        container.innerHTML =
            '<div class="loading">' +
                'No media found.' +
            '</div>';


        return;

    }


    container.innerHTML =
        media.map(
            file =>
                buildMediaCard(file)
        ).join("");

}


/* =========================================================
   MEDIA CARD
   ========================================================= */

function buildMediaCard(file) {

    const url =
        safePreviewUrl(
            file.url ||
            file.public_url ||
            file.href ||
            ""
        );


    const name =
        file.name ||
        file.filename ||
        "Media";


    let visual =
        "";


    if (
        file.content_type &&
        file.content_type.startsWith(
            "video/"
        )
    ) {

        visual =

            '<video' +

                ' class="media-thumb"' +

                ' src="' +
                    escapeHtml(
                        url
                    ) +
                '"' +

                ' controls' +

            '></video>';

    } else {

        visual =

            '<img' +

                ' class="media-thumb"' +

                ' src="' +
                    escapeHtml(
                        url
                    ) +
                '"' +

                ' loading="lazy"' +

                ' onerror="this.style.display=\'none\'"' +

            '>';

    }


    const safeUrl =
        escapeHtml(
            url
        );


    const safeId =
        escapeHtml(
            file.id ||
            file.key ||
            file.name ||
            ""
        );


    return (

        '<div class="media-card">' +

            visual +

            '<div class="media-info">' +

                '<div class="media-name">' +

                    escapeHtml(
                        name
                    ) +

                '</div>' +

                '<div class="button-row">' +

                    '<button class="btn btn-primary btn-small" onclick="useMediaUrl(\'' +
                        safeUrl +
                    '\')">' +

                        "Use" +

                    '</button>' +

                    '<button class="btn btn-danger btn-small" onclick="deleteMedia(\'' +
                        safeId +
                    '\')">' +

                        "Delete" +

                    '</button>' +

                '</div>' +

            '</div>' +

        '</div>'

    );

}


/* =========================================================
   USE MEDIA
   ========================================================= */

function useMediaUrl(url) {

    if (!url) {

        showToast(
            "Media URL موجود نہیں۔"
        );

        return;

    }


    const type =
        $("itemType")?.value ||
        "message";


    if (
        [
            "image",
            "donation",
            "advertisement"
        ].includes(type)
    ) {

        if ($("imageUrl")) {

            $("imageUrl").value =
                url;

        }

    } else if (
        type === "video"
    ) {

        if ($("videoUrl")) {

            $("videoUrl").value =
                url;

        }

    } else {

        if ($("imageUrl")) {

            $("imageUrl").value =
                url;

        }

    }


    showToast(
        "Media URL editor میں ڈال دیا گیا۔"
    );

}


/* =========================================================
   UPLOAD MEDIA
   ========================================================= */

async function uploadMedia() {

    const mediaFile =
        $("mediaFile");


    const file =
        mediaFile?.files?.[0];


    if (!file) {

        showToast(
            "پہلے file select کریں۔"
        );

        return;

    }


    const form =
        new FormData();


    form.append(
        "file",
        file
    );


    try {

        await api(
            "/api/admin/media",
            {
                method:
                    "POST",

                body:
                    form
            }
        );


        if (mediaFile) {

            mediaFile.value =
                "";

        }


        showToast(
            "Media upload ہو گیا۔"
        );


        await loadMedia();


    } catch (error) {

        showToast(
            "Upload failed: " +
            error.message
        );

    }

}


/* =========================================================
   DELETE MEDIA
   ========================================================= */

async function deleteMedia(id) {

    if (!id) {

        return;

    }


    if (
        !confirm(
            "کیا یہ media delete کرنا ہے؟"
        )
    ) {

        return;

    }


    try {

        await api(
            "/api/admin/media/" +
            encodeURIComponent(id),
            {
                method:
                    "DELETE"
            }
        );


        showToast(
            "Media delete ہو گیا۔"
        );


        await loadMedia();


    } catch (error) {

        showToast(
            "Delete failed: " +
            error.message
        );

    }

}


/* =========================================================
   SYSTEM STATUS
   ========================================================= */

async function loadStatus() {

    const output =
        $("systemStatus");


    if (!output) {
        return;
    }


    try {

        const data =
            await api(
                "/api/admin/status"
            );


        output.textContent =
            JSON.stringify(
                data,
                null,
                2
            );


    } catch (error) {

        output.textContent =
            JSON.stringify(
                {
                    success:
                        false,

                    error:
                        error.message
                },
                null,
                2
            );

    }

}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

setInterval(
    () => {

        const app =
            $("app");


        if (
            app &&
            !app.classList.contains(
                "hidden"
            )
        ) {

            updateScheduleStatus();

        }

    },
    30000
);


/* =========================================================
   STARTUP
   ========================================================= */

function startup() {

    const saved =
        localStorage.getItem(
            "mayotube_admin_token"
        );


    const tokenInput =
        $("tokenInput");


    const rememberToken =
        $("rememberToken");


    if (
        saved &&
        tokenInput
    ) {

        tokenInput.value =
            saved;

    }


    if (
        saved &&
        rememberToken
    ) {

        rememberToken.checked =
            true;

    }

}


/*
   HTML مکمل load ہونے کے بعد
   startup چلائیں۔
*/

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        startup
    );

} else {

    startup();

}

</script>
