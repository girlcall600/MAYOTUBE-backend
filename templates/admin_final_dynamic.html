<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYOTUBE Admin New</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#121212;color:#fff;font-family:Arial,sans-serif}
main{width:100%;max-width:900px;margin:auto;padding:8px}
h1{font-size:18px;margin:4px 0 10px}
label{display:block;font-size:13px;margin:6px 0 3px}
input,select,textarea,button{width:100%;padding:8px;border:1px solid #444;border-radius:6px;background:#181818;color:#fff}
textarea{resize:vertical}
button{background:#FFD600;color:#000;border:0;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
.editor-row,.control-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
section{margin-bottom:8px}
details{background:#1c1c1c;border-radius:7px;margin:6px 0;padding:7px}
summary{cursor:pointer;font-weight:bold;font-size:13px}
.check{display:flex;align-items:center;gap:6px}
.check input{width:auto}
.section-title{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;background:#181818;border-radius:7px}
.section-title button{width:auto;padding:5px 9px}
.live-preview{max-height:240px;overflow:auto;padding:7px;background:#121212;border-radius:7px}
.home-content{max-height:280px;overflow:auto}
.preview-empty{text-align:center;padding:20px;opacity:.55}

@media(max-width:600px){
 .editor-row,.control-grid{grid-template-columns:1fr}
 main{padding:6px}
}
</style>
</head>

<body>
<main>

<h1> MAYOTUBE Admin — New</h1>

{% include "admin_parts/editor.html" %}

{% include "admin_parts/controls.html" %}

{% include "admin_parts/preview.html" %}

</main>

<script src="{{ url_for('static', filename='admin_parts/script.js') }}"></script>

</body>
</html>
