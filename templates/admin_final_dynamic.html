<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYOTUBE Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#121212;color:#fff;font-family:Arial,sans-serif}
.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.login-card{width:100%;max-width:360px;background:#1c1c1c;padding:20px;border-radius:10px}
.login-logo{text-align:center;font-size:20px;font-weight:bold;color:#FFD600}
.login-sub{text-align:center;color:#999;font-size:12px;margin:5px 0 18px}
main{width:100%;max-width:900px;margin:auto;padding:8px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#181818;padding:9px;border-radius:8px;margin-bottom:8px}
.brand{font-weight:bold}
.status{font-size:11px;color:#888;margin-top:3px}
.status-dot{display:inline-block;width:7px;height:7px;background:#4caf50;border-radius:50%}
label{display:block;font-size:13px;margin:6px 0 3px}
input,select,textarea,button{width:100%;padding:8px;border:1px solid #444;border-radius:6px;background:#181818;color:#fff}
textarea{resize:vertical}
button{background:#FFD600;color:#000;border:0;font-weight:bold;cursor:pointer}
.logout{width:auto;background:#d32f2f;color:#fff;padding:7px 12px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">MAYOTUBE ADMIN</div>
    <div class="login-sub">Secure Content Management Panel</div>

    <label for="tokenInput">Admin Token</label>
    <input id="tokenInput" type="password" placeholder="Admin Token" autocomplete="off">

    <label style="display:flex;align-items:center;gap:7px;color:#aaa">
      <input id="rememberToken" type="checkbox" style="width:auto">
      Remember Token
    </label>

    <button onclick="login()">🔐 Login</button>
    <div id="loginError" style="color:#f87171;text-align:center;font-size:12px;margin-top:10px"></div>
  </div>
</div>

<div id="app" class="hidden">
  <main>
    <div class="topbar">
      <div>
        <div class="brand">MAYOTUBE ADMIN</div>
        <div class="status">
          <span class="status-dot"></span>
          <span id="connectionText">Connected</span>
        </div>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    {% include "admin_parts/editor.html" %}
    {% include "admin_parts/controls.html" %}
    {% include "admin_parts/preview.html" %}
  </main>
</div>

<script src="{{ url_for('static', filename='admin_parts/script.js') }}"></script>
</body>
</html>
