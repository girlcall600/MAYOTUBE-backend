<section id="styleControls" class="admin-controls">

  <!-- COLORS -->
  <details class="compact-group" open>
    <summary>🎨 Colors</summary>

    <div class="compact-grid colors-grid">

      <label>
        Background
        <input
          id="bgColor"
          type="color"
          value="#181818"
          onchange="refreshPreviewFromForm()">
      </label>

      <label>
        Text
        <input
          id="textColor"
          type="color"
          value="#ffffff"
          onchange="refreshPreviewFromForm()">
      </label>

      <label>
        Accent
        <input
          id="accentColor"
          type="color"
          value="#FFD600"
          onchange="refreshPreviewFromForm()">
      </label>

    </div>
  </details>


  <!-- BOX -->
  <details class="compact-group">
    <summary>📦 Box</summary>

    <div class="compact-grid">

      <label>
        Width
        <input
          id="boxWidth"
          type="text"
          placeholder="100%"
          oninput="refreshPreviewFromForm()">
      </label>

      <label>
        Height
        <input
          id="boxHeight"
          type="text"
          placeholder="auto"
          oninput="refreshPreviewFromForm()">
      </label>

      <label>
        Padding
        <input
          id="boxPadding"
          type="text"
          placeholder="12px"
          oninput="refreshPreviewFromForm()">
      </label>

      <label>
        Radius
        <input
          id="boxRadius"
          type="text"
          placeholder="8px"
          oninput="refreshPreviewFromForm()">
      </label>

    </div>
  </details>


  <!-- BORDER / SHADOW -->
  <details class="compact-group">
    <summary>🖼️ Border / Shadow</summary>

    <div class="compact-grid">

      <label>
        Border Width
        <input
          id="borderWidth"
          type="text"
          placeholder="0"
          oninput="refreshPreviewFromForm()">
      </label>

      <label>
        Border Color
        <input
          id="borderColor"
          type="color"
          value="#333333"
          onchange="refreshPreviewFromForm()">
      </label>

      <label>
        Shadow
        <select
          id="boxShadow"
          onchange="refreshPreviewFromForm()">
          <option value="none">None</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>
      </label>

    </div>
  </details>


  <!-- IMAGE -->
  <details class="compact-group">
    <summary>🖼️ Image Controls</summary>

    <div class="compact-grid">

      <label>
        Width
        <input
          id="imageWidth"
          type="text"
          placeholder="100%"
          oninput="refreshPreviewFromForm()">
      </label>
